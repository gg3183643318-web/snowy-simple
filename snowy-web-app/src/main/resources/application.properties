# 内嵌 Tomcat 监听的 HTTP 端口，所以后端接口地址以 http://localhost:8080 开头。
server.port=8080

# Sa-Token 从名为 token 的请求头或 Cookie 中读取登录凭证。
sa-token.token-name=token

# 登录会话有效期为 3600 秒，也就是 1 小时；超过时间后旧 token 失效。
sa-token.timeout=3600

# true 表示同一个账号可以在多个客户端同时登录，不会自动把之前的登录踢下线。
sa-token.is-concurrent=true

# true 表示同一账号多次登录时可以复用同一个会话 token，而不是每次都创建完全独立的会话。
sa-token.is-share=true

# 关闭 Sa-Token 自带的框架日志，避免干扰本项目用于观察 Filter、Interceptor、AOP 的教学日志。
sa-token.is-log=false
