<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Snowy 请求实验室</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            color: #202724;
            background: #f3f5f4;
            font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 0;
        }

        button,
        input {
            font: inherit;
        }

        button {
            color: inherit;
        }

        button:focus-visible,
        input:focus-visible,
        pre:focus-visible {
            outline: 3px solid #2d6f9f;
            outline-offset: 2px;
        }

        .shell {
            width: min(1120px, 100%);
            margin: 0 auto;
            padding: 22px 20px 36px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 14px;
            padding: 0 2px 16px;
            border-bottom: 1px solid #cfd6d2;
        }

        h1,
        h2 {
            letter-spacing: 0;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.3;
        }

        h2 {
            margin: 0;
            font-size: 17px;
        }

        .header-facts {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px 20px;
            min-width: 0;
        }

        .header-fact {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-size: 14px;
        }

        .fact-label {
            color: #68736e;
        }

        .backend-status,
        .identity-value {
            overflow-wrap: anywhere;
        }

        .backend-status::before {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 7px;
            border-radius: 50%;
            background: #8b9691;
            content: "";
        }

        .backend-status[data-state="loading"]::before {
            background: #c37a16;
        }

        .backend-status[data-state="connected"]::before {
            background: #18836e;
        }

        .backend-status[data-state="error"]::before {
            background: #bd3d45;
        }

        main {
            display: grid;
            gap: 14px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: minmax(280px, 0.75fr) minmax(0, 1.25fr);
            gap: 14px;
        }

        .panel {
            min-width: 0;
            padding: 16px;
            border: 1px solid #cfd6d2;
            border-radius: 8px;
            background: #ffffff;
        }

        .panel-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 13px;
        }

        .panel-meta,
        .selection-status {
            color: #68736e;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .button-row,
        .action-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 38px;
            padding: 8px 11px;
            border: 1px solid #aeb9b4;
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            font-weight: 600;
            line-height: 1.25;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .button:hover:not(:disabled) {
            border-color: #687a72;
            background: #f5f8f6;
        }

        .button:disabled {
            color: #89918d;
            border-color: #d7ddda;
            background: #f2f4f3;
            cursor: not-allowed;
        }

        .button.is-loading {
            border-color: #b8781c;
            box-shadow: inset 3px 0 0 #b8781c;
        }

        .method-badge {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            min-height: 23px;
            padding: 3px 6px;
            border: 1px solid currentColor;
            border-radius: 4px;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
        }

        .method-get {
            color: #157565;
            background: #edf8f4;
        }

        .method-post {
            color: #276fa0;
            background: #eff6fb;
        }

        .method-put {
            color: #9a6417;
            background: #fff7e8;
        }

        .method-delete {
            color: #b23843;
            background: #fff1f2;
        }

        .method-neutral {
            color: #5f6a65;
            background: #f2f4f3;
        }

        .operation-status {
            min-height: 24px;
            margin: 11px 0 0;
            color: #53605a;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .operation-status[data-state="success"] {
            color: #176b59;
        }

        .operation-status[data-state="error"] {
            color: #b12f3b;
            font-weight: 600;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #d9dfdc;
            border-radius: 6px;
        }

        table {
            width: 100%;
            min-width: 660px;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 14px;
        }

        th,
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e7e4;
            text-align: left;
            vertical-align: middle;
            overflow-wrap: anywhere;
        }

        th {
            color: #59645f;
            background: #f5f7f6;
            font-weight: 700;
        }

        th:first-child,
        td:first-child {
            width: 54px;
            text-align: center;
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 90px;
        }

        th:nth-child(4),
        td:nth-child(4) {
            width: 150px;
        }

        th:nth-child(5),
        td:nth-child(5) {
            width: 90px;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr[data-customer-id] {
            cursor: pointer;
        }

        tbody tr[data-customer-id]:hover,
        tbody tr.is-selected {
            background: #f0f7f4;
        }

        .empty-cell {
            height: 88px;
            color: #727c77;
            text-align: center;
        }

        .inspector-facts {
            display: grid;
            grid-template-columns: 0.65fr 2.2fr 0.8fr 1fr 1.5fr;
            gap: 0;
            margin: 0 0 12px;
            border: 1px solid #d9dfdc;
            border-radius: 6px;
            overflow: hidden;
        }

        .inspector-fact {
            min-width: 0;
            padding: 10px 11px;
            border-right: 1px solid #d9dfdc;
        }

        .inspector-fact:last-child {
            border-right: 0;
        }

        dt {
            margin: 0 0 4px;
            color: #6b7570;
            font-size: 12px;
            font-weight: 700;
        }

        dd {
            margin: 0;
            min-height: 23px;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .http-status[data-state="success"] {
            color: #157565;
            font-weight: 700;
        }

        .http-status[data-state="error"] {
            color: #b12f3b;
            font-weight: 700;
        }

        pre {
            min-height: 220px;
            max-height: 420px;
            margin: 0;
            padding: 14px;
            overflow: auto;
            border: 1px solid #263430;
            border-radius: 6px;
            color: #e8efec;
            background: #18221f;
            font: 13px/1.55 Consolas, Monaco, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        @media (max-width: 820px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-facts {
                justify-content: flex-start;
            }

            .control-grid {
                grid-template-columns: 1fr;
            }

            .inspector-facts {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .inspector-fact,
            .inspector-fact:last-child {
                border-right: 1px solid #d9dfdc;
                border-bottom: 1px solid #d9dfdc;
            }

            .inspector-fact:nth-child(2n) {
                border-right: 0;
            }

            .inspector-fact:last-child {
                grid-column: 1 / -1;
                border-right: 0;
                border-bottom: 0;
            }
        }

        @media (max-width: 520px) {
            .shell {
                padding: 16px 12px 28px;
            }

            h1 {
                font-size: 21px;
            }

            .header-facts,
            .header-fact {
                width: 100%;
            }

            .header-fact {
                grid-template-columns: 64px minmax(0, 1fr);
            }

            .panel {
                padding: 13px;
            }

            .panel-heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 3px;
            }

            .button-row .button {
                flex: 1 1 145px;
            }

            .action-grid {
                grid-template-columns: 1fr;
            }

            .inspector-facts {
                grid-template-columns: 1fr;
            }

            .inspector-fact,
            .inspector-fact:nth-child(2n),
            .inspector-fact:last-child {
                grid-column: auto;
                border-right: 0;
                border-bottom: 1px solid #d9dfdc;
            }

            .inspector-fact:last-child {
                border-bottom: 0;
            }

            pre {
                min-height: 190px;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <h1>Simple Snowy 请求实验室</h1>
        <div class="header-facts" aria-label="当前连接和身份信息">
            <div class="header-fact">
                <span class="fact-label">后端状态</span>
                <strong class="backend-status" id="backendStatus" data-state="idle">尚未请求</strong>
            </div>
            <div class="header-fact">
                <span class="fact-label">当前身份</span>
                <strong class="identity-value" id="currentIdentity">未登录</strong>
            </div>
        </div>
    </header>

    <main>
        <div class="control-grid">
            <section class="panel" aria-labelledby="loginTitle">
                <div class="panel-heading">
                    <h2 id="loginTitle">登录身份</h2>
                    <span class="panel-meta" id="sessionState">无本地 Token</span>
                </div>
                <div class="button-row">
                    <button class="button login-button" id="adminLoginButton" type="button" aria-pressed="false">
                        管理员登录
                    </button>
                    <button class="button login-button" id="viewerLoginButton" type="button" aria-pressed="false">
                        只读用户登录
                    </button>
                    <button class="button" id="logoutButton" type="button" data-requires-auth>退出</button>
                </div>
            </section>

            <section class="panel" aria-labelledby="actionTitle">
                <div class="panel-heading">
                    <h2 id="actionTitle">客户 HTTP 操作</h2>
                    <span class="panel-meta">http://localhost:8080</span>
                </div>
                <div class="action-grid">
                    <button class="button" id="getButton" type="button" data-requires-auth>
                        <span class="method-badge method-get">GET</span>
                        查询客户
                    </button>
                    <button class="button" id="postButton" type="button" data-requires-auth>
                        <span class="method-badge method-post">POST</span>
                        新增示例客户
                    </button>
                    <button class="button" id="putButton" type="button" data-requires-auth>
                        <span class="method-badge method-put">PUT</span>
                        修改选中客户
                    </button>
                    <button class="button" id="deleteButton" type="button" data-requires-auth>
                        <span class="method-badge method-delete">DELETE</span>
                        删除选中客户
                    </button>
                </div>
                <p class="operation-status" id="operationStatus" data-state="idle" aria-live="polite">等待操作</p>
            </section>
        </div>

        <section class="panel" aria-labelledby="customerTitle">
            <div class="panel-heading">
                <h2 id="customerTitle">客户列表</h2>
                <span class="selection-status" id="selectionStatus">未选择客户</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th scope="col">选择</th>
                        <th scope="col">ID</th>
                        <th scope="col">客户</th>
                        <th scope="col">负责人</th>
                        <th scope="col">等级</th>
                    </tr>
                    </thead>
                    <tbody id="customerRows">
                    <tr>
                        <td class="empty-cell" colspan="5">暂无客户数据</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="panel" aria-labelledby="inspectorTitle">
            <div class="panel-heading">
                <h2 id="inspectorTitle">请求检查器</h2>
                <span class="panel-meta" id="inspectorState">尚无请求</span>
            </div>
            <dl class="inspector-facts">
                <div class="inspector-fact">
                    <dt>Method</dt>
                    <dd><span class="method-badge method-neutral" id="inspectorMethod">-</span></dd>
                </div>
                <div class="inspector-fact">
                    <dt>URL</dt>
                    <dd id="inspectorUrl">-</dd>
                </div>
                <div class="inspector-fact">
                    <dt>HTTP Status</dt>
                    <dd class="http-status" id="inspectorStatus" data-state="idle">-</dd>
                </div>
                <div class="inspector-fact">
                    <dt>Trace ID</dt>
                    <dd id="inspectorTraceId">-</dd>
                </div>
                <div class="inspector-fact">
                    <dt>Handler</dt>
                    <dd id="inspectorHandler">-</dd>
                </div>
            </dl>
            <pre id="responseBody" tabindex="0" aria-label="格式化响应内容">暂无响应</pre>
        </section>
    </main>
</div>

<script>
    const baseUrl = 'http://localhost:8080';
    const tokenKey = 'simple-snowy-token';
    const userKey = 'simple-snowy-user';

    const elements = {
        backendStatus: document.querySelector('#backendStatus'),
        currentIdentity: document.querySelector('#currentIdentity'),
        sessionState: document.querySelector('#sessionState'),
        operationStatus: document.querySelector('#operationStatus'),
        selectionStatus: document.querySelector('#selectionStatus'),
        customerRows: document.querySelector('#customerRows'),
        inspectorState: document.querySelector('#inspectorState'),
        inspectorMethod: document.querySelector('#inspectorMethod'),
        inspectorUrl: document.querySelector('#inspectorUrl'),
        inspectorStatus: document.querySelector('#inspectorStatus'),
        inspectorTraceId: document.querySelector('#inspectorTraceId'),
        inspectorHandler: document.querySelector('#inspectorHandler'),
        responseBody: document.querySelector('#responseBody'),
        adminLoginButton: document.querySelector('#adminLoginButton'),
        viewerLoginButton: document.querySelector('#viewerLoginButton'),
        logoutButton: document.querySelector('#logoutButton'),
        getButton: document.querySelector('#getButton'),
        postButton: document.querySelector('#postButton'),
        putButton: document.querySelector('#putButton'),
        deleteButton: document.querySelector('#deleteButton')
    };

    const controls = Array.from(document.querySelectorAll('button'));
    let customers = [];
    let selectedCustomerId = null;
    let isBusy = false;
    let sampleSequence = 0;

    function setBackendStatus(text, state) {
        elements.backendStatus.textContent = text;
        elements.backendStatus.dataset.state = state;
    }

    function setOperationStatus(text, state = 'idle') {
        elements.operationStatus.textContent = text;
        elements.operationStatus.dataset.state = state;
    }

    function readSavedUser() {
        const savedUser = localStorage.getItem(userKey);
        if (!savedUser) return null;

        try {
            return JSON.parse(savedUser);
        } catch (error) {
            localStorage.removeItem(userKey);
            return null;
        }
    }

    function renderIdentity(user) {
        const username = user && user.username;
        elements.currentIdentity.textContent = user
            ? `${user.displayName}（${username}）`
            : '未登录';
        elements.sessionState.textContent = localStorage.getItem(tokenKey)
            ? 'Token 已保存'
            : '无本地 Token';

        for (const [button, account] of [
            [elements.adminLoginButton, 'admin'],
            [elements.viewerLoginButton, 'viewer']
        ]) {
            const isCurrent = username === account;
            button.setAttribute('aria-pressed', String(isCurrent));
        }

        updateControlStates();
    }

    function updateControlStates(activeButton = null) {
        const hasToken = Boolean(localStorage.getItem(tokenKey));
        controls.forEach(button => {
            const requiresAuth = button.hasAttribute('data-requires-auth');
            button.disabled = isBusy || (requiresAuth && !hasToken);
            button.classList.toggle('is-loading', isBusy && button === activeButton);
            button.setAttribute('aria-busy', String(isBusy && button === activeButton));
        });
    }

    function setBusy(busy, activeButton = null) {
        isBusy = busy;
        updateControlStates(activeButton);
    }

    function clearCustomerData() {
        customers = [];
        selectedCustomerId = null;
        renderCustomers();
    }

    function clearSession() {
        localStorage.removeItem(tokenKey);
        localStorage.removeItem(userKey);
        renderIdentity(null);
        clearCustomerData();
    }

    function methodClass(method) {
        const knownMethods = ['GET', 'POST', 'PUT', 'DELETE'];
        return knownMethods.includes(method) ? `method-${method.toLowerCase()}` : 'method-neutral';
    }

    function formatResponse(result) {
        if (typeof result === 'string') return result || '(空响应体)';
        if (result === undefined) return '(空响应体)';
        return JSON.stringify(result, null, 2);
    }

    function renderInspector({method, path, status, traceId, handler, result, state}) {
        elements.inspectorMethod.textContent = method;
        elements.inspectorMethod.className = `method-badge ${methodClass(method)}`;
        elements.inspectorUrl.textContent = path.startsWith('http') ? path : `${baseUrl}${path}`;
        elements.inspectorStatus.textContent = String(status);
        elements.inspectorTraceId.textContent = traceId || '-';
        elements.inspectorHandler.textContent = handler || '-';
        elements.responseBody.textContent = formatResponse(result);

        const numericStatus = Number(status);
        const statusState = Number.isFinite(numericStatus)
            ? (numericStatus >= 200 && numericStatus < 300 ? 'success' : 'error')
            : (state === 'error' ? 'error' : 'idle');
        elements.inspectorStatus.dataset.state = statusState;
        elements.inspectorState.textContent = state === 'loading'
            ? '请求中'
            : (state === 'error' ? '请求失败' : '最近一次请求');
    }

    function renderLocalError(method, path, message) {
        setOperationStatus(message, 'error');
        renderInspector({
            method,
            path,
            status: '未发送',
            traceId: '-',
            handler: '-',
            result: {code: 'LOCAL_VALIDATION', message},
            state: 'error'
        });
    }

    /**
     * 所有后端调用都经过这个函数。它像前端统一的 HTTP 客户端：负责补请求头、发送请求，
     * 再按 inspect 选项决定是否把 HTTP 状态、响应头和响应体交给检查器展示。
     */
    async function request(path, options = {}) {
        // inspect 是实验室自己的显示选项，不属于 fetch 标准配置；先拆出来，避免把它发送给浏览器网络 API。
        const {inspect = true, ...fetchOptions} = options;

        // options.method 没传时，fetch 默认使用 GET；这里显式算出 method，方便检查器展示本次请求事实。
        const method = fetchOptions.method || 'GET';
        const token = localStorage.getItem(tokenKey);

        // headers 携带的是 HTTP 元数据，例如登录 token 和请求体类型。Headers 能合并普通对象、
        // 键值数组或另一个 Headers；随后再补公共字段，作用类似 Gateway 或拦截器统一增加请求信息。
        const headers = new Headers(fetchOptions.headers || {});
        if (token) headers.set('token', token);

        // HTTP 网络上传输的 body 是文本/字节，不是 JavaScript 对象本身。因此调用 POST、PUT 时要先用
        // JSON.stringify(object) 变成 JSON 文本；只有确实存在 body 时才声明 application/json。
        if (fetchOptions.body !== undefined && fetchOptions.body !== null) {
            headers.set('Content-Type', 'application/json');
        }

        if (inspect) {
            renderInspector({
                method,
                path,
                status: '请求中',
                traceId: '-',
                handler: '-',
                result: {message: '等待后端响应'},
                state: 'loading'
            });
        }
        setBackendStatus('请求中', 'loading');

        let response;
        try {
            // fetch 会立即返回 Promise。await 表示等这个异步结果回来后再继续当前函数，期间不会阻塞
            // 浏览器主线程，页面仍然可以完成绘制；按钮禁用是为了避免重复操作，不是因为浏览器卡住。
            response = await fetch(`${baseUrl}${path}`, {...fetchOptions, headers});
        } catch (error) {
            setBackendStatus('无法连接', 'error');
            if (inspect) {
                renderInspector({
                    method,
                    path,
                    status: '网络错误',
                    traceId: '-',
                    handler: '-',
                    result: {message: error.message || '无法连接后端'},
                    state: 'error'
                });
            }
            throw error;
        }

        // status 和 headers 是 HTTP 响应元数据；response.json()/response.text() 读取的则是响应体，
        // 它们彼此分开。这里先读 text，再尝试 JSON.parse，后端即使返回非 JSON 文本也能正常展示。
        const responseText = await response.text();
        let result;
        if (!responseText) {
            result = null;
        } else {
            try {
                result = JSON.parse(responseText);
            } catch (error) {
                result = responseText;
            }
        }

        const traceId = response.headers.get('X-Trace-Id');
        const handler = response.headers.get('X-Handler');
        if (inspect) {
            renderInspector({
                method,
                path,
                status: response.status,
                traceId,
                handler,
                result,
                state: response.ok ? 'success' : 'error'
            });
        }
        setBackendStatus('已响应', 'connected');

        if (response.status === 401) {
            clearSession();
        }

        // response.ok 只在 HTTP 2xx 时为 true。401、403、404、500 都会进入这里；可见请求已保留
        // 原始响应事实，静默请求则不改检查器，但两者都会抛错并让按钮流程显示错误，不使用 alert。
        const resultMessage = result && typeof result === 'object' ? result.message : '';
        if (!response.ok) {
            throw new Error(resultMessage || `HTTP ${response.status}`);
        }

        return result;
    }

    function createCell(text) {
        const cell = document.createElement('td');
        cell.textContent = text;
        return cell;
    }

    function getSelectedCustomer() {
        return customers.find(customer => customer.id === selectedCustomerId) || null;
    }

    function updateSelectionStatus() {
        const selected = getSelectedCustomer();
        elements.selectionStatus.textContent = selected
            ? `已选 #${selected.id} ${selected.name}`
            : '未选择客户';
    }

    function renderCustomers() {
        elements.customerRows.replaceChildren();

        if (customers.length === 0) {
            const row = document.createElement('tr');
            const cell = createCell('暂无客户数据');
            cell.colSpan = 5;
            cell.className = 'empty-cell';
            row.appendChild(cell);
            elements.customerRows.appendChild(row);
            updateSelectionStatus();
            return;
        }

        if (!customers.some(customer => customer.id === selectedCustomerId)) {
            selectedCustomerId = null;
        }

        const fragment = document.createDocumentFragment();
        customers.forEach(customer => {
            const row = document.createElement('tr');
            const selectionCell = document.createElement('td');
            const radio = document.createElement('input');
            const isSelected = customer.id === selectedCustomerId;

            row.dataset.customerId = String(customer.id);
            row.classList.toggle('is-selected', isSelected);
            radio.type = 'radio';
            radio.name = 'selected-customer';
            radio.value = String(customer.id);
            radio.checked = isSelected;
            radio.setAttribute('aria-label', `选择客户 ${customer.name}`);
            selectionCell.appendChild(radio);

            row.append(
                selectionCell,
                createCell(String(customer.id)),
                createCell(customer.name),
                createCell(customer.owner),
                createCell(customer.level)
            );
            fragment.appendChild(row);
        });

        elements.customerRows.appendChild(fragment);
        updateSelectionStatus();
    }

    function selectCustomer(id) {
        selectedCustomerId = id;
        renderCustomers();
    }

    async function loadCustomers({inspect = true} = {}) {
        // GET 没有请求体，也可以不写 method；request() 会展示它最终采用的默认 GET 方法。
        const result = await request('/api/crm/customers', {inspect});
        customers = Array.isArray(result && result.data) ? result.data : [];
        renderCustomers();
        return customers;
    }

    async function runOperation(activeButton, pendingText, operation) {
        if (isBusy) return;
        setBusy(true, activeButton);
        setOperationStatus(pendingText, 'idle');
        try {
            await operation();
        } catch (error) {
            setOperationStatus(error.message || '请求失败', 'error');
        } finally {
            setBusy(false);
        }
    }

    async function login(username, button) {
        await runOperation(button, `正在登录 ${username}`, async () => {
            const result = await request('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({username})
            });
            localStorage.setItem(tokenKey, result.data.token);
            localStorage.setItem(userKey, JSON.stringify(result.data.user));
            renderIdentity(result.data.user);
            await loadCustomers();
            setOperationStatus(`已登录：${result.data.user.displayName}`, 'success');
        });
    }

    async function logout() {
        await runOperation(elements.logoutButton, '正在退出', async () => {
            let logoutError = null;
            if (localStorage.getItem(tokenKey)) {
                try {
                    await request('/api/auth/logout', {method: 'POST'});
                } catch (error) {
                    logoutError = error;
                }
            }

            clearSession();
            if (logoutError) {
                setOperationStatus(`本地登录信息已清除；${logoutError.message}`, 'error');
            } else {
                setOperationStatus('已退出，客户列表已清空', 'success');
            }
        });
    }

    function sampleName() {
        sampleSequence += 1;
        return `示例客户-${Date.now()}-${sampleSequence}`;
    }

    function changedCustomer(selected) {
        const levels = ['A', 'B', 'C'];
        const levelIndex = levels.indexOf(selected.level);
        const nextLevel = levels[(levelIndex + 1 + levels.length) % levels.length];
        const baseName = selected.name.replace(/\s*·\s*已修改.*$/, '');
        const time = new Date().toLocaleTimeString('zh-CN', {hour12: false});

        return {
            name: `${baseName} · 已修改 ${time}`,
            owner: selected.owner === '接口实验员' ? 'Java 学习者' : '接口实验员',
            level: nextLevel
        };
    }

    elements.adminLoginButton.addEventListener('click', () => {
        login('admin', elements.adminLoginButton);
    });

    elements.viewerLoginButton.addEventListener('click', () => {
        login('viewer', elements.viewerLoginButton);
    });

    elements.logoutButton.addEventListener('click', logout);

    elements.getButton.addEventListener('click', () => {
        runOperation(elements.getButton, '正在查询客户', async () => {
            await loadCustomers();
            setOperationStatus(`查询完成，共 ${customers.length} 条客户`, 'success');
        });
    });

    elements.postButton.addEventListener('click', () => {
        runOperation(elements.postButton, '正在新增示例客户', async () => {
            const result = await request('/api/crm/customers', {
                method: 'POST',
                body: JSON.stringify({
                    name: sampleName(),
                    owner: '浏览器实验员',
                    level: 'B'
                })
            });
            selectedCustomerId = result.data.id;
            // 静默执行后续 GET，只刷新表格，不覆盖刚才 POST 的状态、响应头和响应体。
            await loadCustomers({inspect: false});
            setOperationStatus(`已新增并选中客户 #${selectedCustomerId}`, 'success');
        });
    });

    elements.putButton.addEventListener('click', () => {
        const selected = getSelectedCustomer();
        if (!selected) {
            renderLocalError('PUT', '/api/crm/customers/{id}', '请先在客户表中选择一条客户');
            return;
        }

        runOperation(elements.putButton, `正在修改客户 #${selected.id}`, async () => {
            const result = await request(`/api/crm/customers/${selected.id}`, {
                method: 'PUT',
                body: JSON.stringify(changedCustomer(selected))
            });
            selectedCustomerId = result.data.id;
            await loadCustomers({inspect: false});
            setOperationStatus(`已修改并选中客户 #${selectedCustomerId}`, 'success');
        });
    });

    elements.deleteButton.addEventListener('click', () => {
        const selected = getSelectedCustomer();
        if (!selected) {
            renderLocalError('DELETE', '/api/crm/customers/{id}', '请先在客户表中选择一条客户');
            return;
        }

        runOperation(elements.deleteButton, `正在删除客户 #${selected.id}`, async () => {
            await request(`/api/crm/customers/${selected.id}`, {method: 'DELETE'});
            selectedCustomerId = null;
            await loadCustomers({inspect: false});
            setOperationStatus(`已删除客户 #${selected.id}`, 'success');
        });
    });

    elements.customerRows.addEventListener('change', event => {
        if (event.target.matches('input[name="selected-customer"]')) {
            selectCustomer(Number(event.target.value));
        }
    });

    elements.customerRows.addEventListener('click', event => {
        if (event.target.matches('input[name="selected-customer"]')) return;
        const row = event.target.closest('tr[data-customer-id]');
        if (row) selectCustomer(Number(row.dataset.customerId));
    });

    async function initialize() {
        const savedUser = readSavedUser();
        renderIdentity(savedUser);
        renderCustomers();

        if (!localStorage.getItem(tokenKey)) {
            renderIdentity(null);
            setOperationStatus('未登录', 'idle');
            return;
        }

        setBusy(true);
        setOperationStatus('正在校验已保存的登录状态', 'idle');
        try {
            const result = await request('/api/auth/me');
            localStorage.setItem(userKey, JSON.stringify(result.data));
            renderIdentity(result.data);
            await loadCustomers();
            setOperationStatus('登录状态已恢复', 'success');
        } catch (error) {
            setOperationStatus(error.message || '登录状态校验失败', 'error');
        } finally {
            setBusy(false);
        }
    }

    initialize();
</script>
</body>
</html>
